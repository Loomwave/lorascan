# Loomwave bench Pi 5 with the Nebra Duo HAT (E22P-915M30S SX1262 on spidev0.0). Pins are the
# infrad sx_open() defaults: BUSY 23, DIO1 24, RESET 22, NSS = kernel CE0, no RXEN/TXEN (DIO2 drives
# the RF switch, TCXO 1.8 V on DIO3). max_tx_dbm is the bench cap; P1 never transmits anyway.
name: nebra-duo-hat
bus: {type: spidev, dev: /dev/spidev0.0, hz: 2000000}
pins: {nss: kernel, reset: 22, busy: 23, dio1: 24, rxen: null, txen: null}
radio: {tcxo_v: 1.8, dio2_rf_switch: true, rx_boosted: true, max_tx_dbm: -9}
cal:   {rssi_offset_db: 0.0, scan_offset_dbm: -11}
