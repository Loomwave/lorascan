name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the TARGET interpreter (the tower and bench Pis run it) and must stay first-class:
        # v0.1.17 and v0.1.18 shipped green on 3.12 and died on 3.11 with a PEP 701 f-string.
        python-version: ["3.11", "3.12", "3.13"]
    name: py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Syntax gate (compileall under this interpreter)
        run: python -m compileall -q lorascan/
      - name: Tests
        run: python -m pytest -q -rs

  build:
    runs-on: ubuntu-latest
    name: wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel the release attaches
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -l dist/
      - name: The wheel must import and run under 3.11
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          /tmp/wheeltest/bin/lorascan --help > /dev/null
          /tmp/wheeltest/bin/python -c 'import lorascan, sys; print("lorascan", lorascan.__version__, "on", sys.version.split()[0])'
